<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GameVault - Login</title>

    <link rel="stylesheet" href="auth.css">

</head>

<body>

    <div class="auth-page">

        <div class="auth-card">


            <!-- =========================================
                 LOGO
                 ========================================= -->

            <div class="auth-logo">

                <div class="auth-logo-icon">
                    🎮
                </div>

                <h1>
                    Game<span>Vault</span>
                </h1>

            </div>


            <!-- =========================================
                 LOGIN
                 ========================================= -->

            <div
                class="auth-form-container active"
                id="loginContainer"
            >

                <div class="auth-heading">

                    <h2>
                        Welcome Back
                    </h2>

                    <p>
                        Login to manage your gaming collection
                    </p>

                </div>


                <form id="loginForm">


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="loginEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="loginPassword">
                            Password
                        </label>


                        <div class="password-input-wrapper">

                            <input
                                type="password"
                                id="loginPassword"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >


                            <button
                                type="button"
                                class="password-toggle"
                                id="toggleLoginPassword"
                                aria-label="Show password"
                                title="Show password"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Login
                    </button>


                    <p
                        class="auth-message"
                        id="loginMessage"
                    ></p>

                </form>


                <div class="switch-auth">

                    <span>
                        Don't have an account?
                    </span>

                    <button
                        type="button"
                        id="showRegister"
                    >
                        Create Account
                    </button>

                </div>

            </div>


            <!-- =========================================
                 REGISTER
                 ========================================= -->

            <div
                class="auth-form-container"
                id="registerContainer"
            >

                <div class="auth-heading">

                    <h2>
                        Create Account
                    </h2>

                    <p>
                        Start building your gaming collection
                    </p>

                </div>


                <form id="registerForm">


                    <!-- NAME -->

                    <div class="form-group">

                        <label for="registerName">
                            Name
                        </label>

                        <input
                            type="text"
                            id="registerName"
                            placeholder="Enter your name"
                            autocomplete="name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="registerEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="registerPassword">
                            Password
                        </label>


                        <div class="password-input-wrapper">

                            <input
                                type="password"
                                id="registerPassword"
                                placeholder="Minimum 6 characters"
                                autocomplete="new-password"
                                minlength="6"
                                required
                            >


                            <button
                                type="button"
                                class="password-toggle"
                                id="toggleRegisterPassword"
                                aria-label="Show password"
                                title="Show password"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>


                        <div class="password-input-wrapper">

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm your password"
                                autocomplete="new-password"
                                minlength="6"
                                required
                            >


                            <button
                                type="button"
                                class="password-toggle"
                                id="toggleConfirmPassword"
                                aria-label="Show password"
                                title="Show password"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Create Account
                    </button>


                    <p
                        class="auth-message"
                        id="registerMessage"
                    ></p>

                </form>


                <div class="switch-auth">

                    <span>
                        Already have an account?
                    </span>

                    <button
                        type="button"
                        id="showLogin"
                    >
                        Login
                    </button>

                </div>

            </div>

        </div>

    </div>


    <script src="auth.js"></script>

</body>

</html>
